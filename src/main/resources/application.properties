# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

# Application name
spring.application.name=govpay-fdr-batch

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Rome

# Spring Batch configuration
spring.batch.job.enabled=false

# Batch configuration
govpay.batch.enabled=true
govpay.batch.max-retries=3
govpay.batch.page-size=1000
govpay.batch.thread-pool-size=5
govpay.batch.headers-chunk-size=1
govpay.batch.metadata-chunk-size=100
govpay.batch.payments-chunk-size=50
govpay.batch.skip-limit=10
# Gestione publishedGt oltre la finestra accettata da pagoPA (HTTP 400 FDR-1000, "date cannot be older than 30 days")
# published-gt-max-age-days: soglia in giorni (default 30)
# published-gt-stale-strategy: ALL (default, recupera tutti i flussi) | CLAMP (riporta la data a adesso - max-age-days)
govpay.batch.published-gt-max-age-days=30
govpay.batch.published-gt-stale-strategy=ALL

# Acquisizione dei flussi di rendicontazione da directory sul file system.
# Canale alternativo alle API pagoPA: i file JSON depositati in govpay.fdr.input.dir
# vengono acquisiti prima dell'interrogazione del Nodo. Disabilitato di default.
# Il formato atteso e' la response della GET puntuale sul flusso con i pagamenti inline
# (l'unione di .../psps/{pspId} e .../psps/{pspId}/payments).
govpay.fdr.input.enabled=false
# Directory di acquisizione (obbligatoria quando enabled=true)
#govpay.fdr.input.dir=/var/govpay/fdr/input
# Destinazioni post-elaborazione (default: <dir>/processed e <dir>/error)
#govpay.fdr.input.processed-dir=/var/govpay/fdr/processed
#govpay.fdr.input.error-dir=/var/govpay/fdr/error
# Estensione dei file da acquisire
govpay.fdr.input.extension=.json
# Numero massimo di file elaborati in una singola esecuzione del job
govpay.fdr.input.max-files-per-run=1000

# Cluster ID configuration (unique identifier for each node in multi-node setup)
govpay.batch.cluster-id=GovPay-FDR-Batch

# Multi-node job execution timeout configuration
# Maximum minutes since last update before a job is considered stale/stuck (default: 120 minutes = 2 hours)
govpay.batch.stale-threshold-minutes=120

# Scheduler configuration
# Fixed delay between job executions (in milliseconds) - default 2 hours
scheduler.fdrAcquisitionJob.fixedDelayString=7200000
# Initial delay before first execution (in milliseconds) - default 1ms
scheduler.initialDelayString=1


# Actuator configuration
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
# Tag comune per distinguere il servizio quando Prometheus raccoglie piu' app.
management.metrics.tags.application=govpay-fdr-batch
